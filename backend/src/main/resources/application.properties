# ==============================================================================
# TRICHYFLOW Spring Boot Application Properties
# Default Profile: Embedded MySQL-Compatible Database for zero-setup execution
# ==============================================================================

server.port=8080
spring.application.name=trichyflow-backend

# Embedded In-Memory Database with MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:trichyflow_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Static Resource Serving (Direct Frontend Web App Serving)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.com.trichyflow=INFO
logging.level.org.springframework.web=INFO
