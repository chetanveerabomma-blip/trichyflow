<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRICHYFLOW — Register Officer / Operator | Trichy Traffic Control</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --saffron: #FF9933;
      --white: #FFFFFF;
      --india-green: #138808;
      --navy: #000080;
      --card-bg: rgba(13, 27, 54, 0.90);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
    }

    body {
      background: radial-gradient(circle at 10% 20%, rgba(255, 153, 51, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 90% 85%, rgba(19, 136, 8, 0.22) 0%, transparent 45%),
                  linear-gradient(135deg, #050C1A 0%, #0A1122 50%, #060E1E 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 2rem 1rem;
    }

    .register-container {
      width: 100%;
      max-width: 540px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      padding: 2.25rem;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--saffron) 0%, #FFFFFF 50%, var(--india-green) 100%);
    }

    .app-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--saffron) 0%, #FFFFFF 50%, var(--india-green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 0.35rem;
    }

    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px rgba(255, 153, 51, 0.2);
      color: #FFFFFF;
    }

    .btn-register {
      background: linear-gradient(135deg, var(--india-green) 0%, #15803d 100%);
      border: none;
      color: #FFFFFF;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.75rem;
      border-radius: 10px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(21, 128, 61, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-register:hover {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="glass-card">
      <div class="text-center mb-4">
        <h1 class="app-title"><i class="fa-solid fa-id-card-clip text-warning me-2"></i>Officer Registration</h1>
        <div class="text-muted small">Trichy City Traffic Department Portal</div>
      </div>

      <div th:if="${error}" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}">Registration failed. Please check your inputs.</span>
      </div>

      <form th:action="@{/register}" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName" class="form-control" placeholder="e.g. Inspector R. Karthik" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="e.g. karthik_tp" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Assigned Role</label>
            <select name="role" class="form-select" required>
              <option value="TRAFFIC_POLICE" selected>TRAFFIC POLICE (Field Enforcement)</option>
              <option value="CONTROL_ROOM">CONTROL ROOM (Desk Operator)</option>
              <option value="ADMIN">ADMIN (Supervisory Officer)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Badge Number / Service ID</label>
            <input type="text" name="badgeNumber" class="form-control" placeholder="e.g. TP-SRIR-88" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Official Email</label>
            <input type="email" name="email" class="form-control" placeholder="karthik@trichyflow.gov.in" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Mobile Number</label>
            <input type="text" name="phone" class="form-control" placeholder="+91 94431 XXXXX" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Secure Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-register mt-4">
          <i class="fa-solid fa-user-check me-2"></i> Complete Registration in Database
        </button>
      </form>

      <div class="text-center mt-3 pt-2">
        <span class="text-muted small">Already registered?</span>
        <a th:href="@{/login}" class="text-warning text-decoration-none small fw-semibold ms-1">
          <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Return to Login
        </a>
      </div>
    </div>
  </div>

</body>
</html>
