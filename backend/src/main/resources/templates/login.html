<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRICHYFLOW — Java Portal Login | Trichy Traffic Control</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --saffron: #FF9933;
      --white: #FFFFFF;
      --india-green: #138808;
      --navy: #000080;
      --bg-dark: #060E1E;
      --card-bg: rgba(13, 27, 54, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
    }

    body {
      background: radial-gradient(circle at 10% 20%, rgba(255, 153, 51, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 90% 85%, rgba(19, 136, 8, 0.22) 0%, transparent 45%),
                  linear-gradient(135deg, #050C1A 0%, #0A1122 50%, #060E1E 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow-x: hidden;
      position: relative;
    }

    .ashoka-chakra-bg {
      position: absolute;
      width: 580px;
      height: 580px;
      opacity: 0.045;
      animation: rotateChakra 120s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes rotateChakra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      padding: 2.25rem;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--saffron) 0%, var(--saffron) 33%, #FFFFFF 33%, #FFFFFF 66%, var(--india-green) 66%, var(--india-green) 100%);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .app-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin: 0.5rem 0 0.2rem;
      background: linear-gradient(90deg, var(--saffron) 0%, #FFFFFF 50%, var(--india-green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-subtitle {
      color: #94A3B8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .badge-java {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 88, 12, 0.2);
      border: 1px solid rgba(234, 88, 12, 0.45);
      color: #fb923c;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 6px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 0.4rem;
    }

    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px rgba(255, 153, 51, 0.2);
      color: #FFFFFF;
    }

    .btn-tricolour {
      background: linear-gradient(135deg, var(--saffron) 0%, #ea580c 100%);
      border: none;
      color: #FFFFFF;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 0.75rem;
      border-radius: 10px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-tricolour:hover {
      background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.6);
      transform: translateY(-1px);
    }

    .demo-pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #E2E8F0;
      font-size: 0.78rem;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .demo-pill-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      border-color: var(--accent-blue);
    }

    .alert-custom {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>

  <!-- Rotating Ashoka Chakra Background -->
  <svg class="ashoka-chakra-bg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>
    <!-- 24 Spokes -->
    <g stroke="#FFFFFF" stroke-width="0.8">
      <line x1="50" y1="50" x2="50" y2="5" />
      <line x1="50" y1="50" x2="50" y2="95" />
      <line x1="50" y1="50" x2="5" y2="50" />
      <line x1="50" y1="50" x2="95" y2="50" />
      <line x1="50" y1="50" x2="18.18" y2="18.18" />
      <line x1="50" y1="50" x2="81.82" y2="81.82" />
      <line x1="50" y1="50" x2="18.18" y2="81.82" />
      <line x1="50" y1="50" x2="81.82" y2="18.18" />
      <line x1="50" y1="50" x2="38.36" y2="6.6" />
      <line x1="50" y1="50" x2="61.64" y2="93.4" />
      <line x1="50" y1="50" x2="6.6" y2="38.36" />
      <line x1="50" y1="50" x2="93.4" y2="61.64" />
      <line x1="50" y1="50" x2="26.7" y2="11.7" />
      <line x1="50" y1="50" x2="73.3" y2="88.3" />
      <line x1="50" y1="50" x2="11.7" y2="26.7" />
      <line x1="50" y1="50" x2="88.3" y2="73.3" />
      <line x1="50" y1="50" x2="61.64" y2="6.6" />
      <line x1="50" y1="50" x2="38.36" y2="93.4" />
      <line x1="50" y1="50" x2="93.4" y2="38.36" />
      <line x1="50" y1="50" x2="6.6" y2="61.64" />
      <line x1="50" y1="50" x2="73.3" y2="11.7" />
      <line x1="50" y1="50" x2="26.7" y2="88.3" />
      <line x1="50" y1="50" x2="88.3" y2="26.7" />
      <line x1="50" y1="50" x2="11.7" y2="73.3" />
    </g>
  </svg>

  <div class="login-container">
    <div class="glass-card">
      <div class="logo-area">
        <div style="font-size: 2.2rem; color: var(--saffron);">
          <i class="fa-solid fa-traffic-light"></i>
        </div>
        <h1 class="app-title">TRICHYFLOW</h1>
        <div class="app-subtitle">City Traffic Coordination Platform</div>
        <div>
          <span class="badge-java">
            <i class="fa-brands fa-java"></i> Java Spring Boot Server Portal
          </span>
        </div>
      </div>

      <!-- Feedback Alerts -->
      <div th:if="${error}" class="alert-custom alert alert-danger d-flex align-items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span th:text="${error}">Invalid credentials. Please try again.</span>
      </div>

      <div th:if="${msg}" class="alert-custom alert alert-success d-flex align-items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${msg}">Account registered successfully! You can now log in.</span>
      </div>

      <!-- Java Form Login -->
      <form th:action="@{/login}" method="post" id="loginForm">
        <div class="mb-3">
          <label class="form-label">
            <i class="fa-solid fa-user text-warning me-1"></i> Username / Badge ID
          </label>
          <input type="text" name="username" id="username" class="form-control" placeholder="Enter username or badge" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label">
            <i class="fa-solid fa-lock text-warning me-1"></i> Password
          </label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Enter secure password" required>
        </div>

        <div class="mb-3">
          <label class="form-label">
            <i class="fa-solid fa-id-badge text-warning me-1"></i> Authorized Role
          </label>
          <select name="role" id="role" class="form-select">
            <option value="ADMIN">ADMIN — Traffic Commissioner / Superuser</option>
            <option value="TRAFFIC_POLICE">TRAFFIC POLICE — Field & Enforcement Officer</option>
            <option value="CONTROL_ROOM" selected>CONTROL ROOM — Traffic Desk Operator</option>
          </select>
        </div>

        <button type="submit" class="btn btn-tricolour mt-2">
          <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Authenticate & Enter Portal
        </button>
      </form>

      <!-- 1-Click Demo Fill -->
      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
        <div class="text-center text-muted small mb-2 fw-semibold">1-CLICK QUICK DEMO LOGIN</div>
        <div class="d-grid gap-2 d-md-flex justify-content-between">
          <button type="button" class="demo-pill-btn flex-fill" onclick="fillDemo('admin', 'admin123', 'ADMIN')">
            <i class="fa-solid fa-shield-halved text-warning me-1"></i> Admin
          </button>
          <button type="button" class="demo-pill-btn flex-fill" onclick="fillDemo('police', 'police123', 'TRAFFIC_POLICE')">
            <i class="fa-solid fa-hand text-info me-1"></i> Police
          </button>
          <button type="button" class="demo-pill-btn flex-fill" onclick="fillDemo('control', 'control123', 'CONTROL_ROOM')">
            <i class="fa-solid fa-desktop text-success me-1"></i> Control
          </button>
        </div>
      </div>

      <!-- Registration & Client Links -->
      <div class="text-center mt-3 pt-2">
        <a th:href="@{/register}" class="text-info text-decoration-none small me-3">
          <i class="fa-solid fa-user-plus me-1"></i> Register New Officer
        </a>
        <span class="text-muted small">|</span>
        <a href="/frontend/index.html" class="text-warning text-decoration-none small ms-3">
          <i class="fa-solid fa-globe me-1"></i> Client Portal (SPA)
        </a>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(username, password, role) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
      document.getElementById('role').value = role;
    }
  </script>
</body>
</html>
