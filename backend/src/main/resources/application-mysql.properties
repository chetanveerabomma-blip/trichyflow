# ==============================================================================
# TRICHYFLOW MySQL Production Profile
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ==============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/trichyflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
