<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="30%" stop-color="#E5A93C"/>
      <stop offset="70%" stop-color="#C2841E"/>
      <stop offset="100%" stop-color="#84520A"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2447"/>
      <stop offset="100%" stop-color="#050C1A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Group for entire Emblem -->
  <g filter="url(#badgeShadow)">

    <!-- 1. Laurel Wreath Outer Border -->
    <g fill="url(#goldGrad)" opacity="0.95">
      <!-- Left Laurel Branch -->
      <path d="M 90 280 C 40 230 40 130 90 85 C 93 92 85 105 80 120 C 72 145 74 180 90 215 C 98 232 108 248 120 262 Z"/>
      <!-- Right Laurel Branch -->
      <path d="M 230 280 C 280 230 280 130 230 85 C 227 92 235 105 240 120 C 248 145 246 180 230 215 C 222 232 212 248 200 262 Z"/>
      <!-- Individual Laurel Leaves Left -->
      <path d="M 85 90 C 70 80 60 95 72 105 Z"/>
      <path d="M 68 115 C 50 110 45 125 58 135 Z"/>
      <path d="M 58 145 C 38 145 36 162 50 170 Z"/>
      <path d="M 56 180 C 38 185 38 202 54 206 Z"/>
      <path d="M 64 215 C 48 225 54 242 70 240 Z"/>
      <path d="M 80 248 C 68 260 80 274 95 268 Z"/>
      <!-- Individual Laurel Leaves Right -->
      <path d="M 235 90 C 250 80 260 95 248 105 Z"/>
      <path d="M 252 115 C 270 110 275 125 262 135 Z"/>
      <path d="M 262 145 C 282 145 284 162 270 170 Z"/>
      <path d="M 264 180 C 282 185 282 202 266 206 Z"/>
      <path d="M 256 215 C 272 225 266 242 250 240 Z"/>
      <path d="M 240 248 C 252 260 240 274 225 268 Z"/>
    </g>

    <!-- 2. Central Police Shield -->
    <path d="M 160 55 C 220 55 242 75 242 125 C 242 210 185 265 160 282 C 135 265 78 210 78 125 C 78 75 100 55 160 55 Z" 
          fill="url(#shieldNavy)" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Shield Inner Bezel -->
    <path d="M 160 62 C 213 62 233 80 233 125 C 233 203 182 254 160 270 C 138 254 87 203 87 125 C 87 80 107 62 160 62 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Central Sunburst / Glow -->
    <circle cx="160" cy="148" r="62" fill="url(#sunGlow)"/>

    <!-- 3. Srivilliputhur Temple Rajagopuram (Tamil Nadu State Emblem Central Motif) -->
    <g fill="url(#goldGrad)">
      <!-- Gopuram Kalasams (Finials on top) -->
      <circle cx="160" cy="98" r="2.5"/>
      <circle cx="152" cy="99" r="2"/>
      <circle cx="168" cy="99" r="2"/>
      <circle cx="144" cy="101" r="1.5"/>
      <circle cx="176" cy="101" r="1.5"/>

      <!-- Gopuram Top Tier (Stupi) -->
      <polygon points="140,103 180,103 176,108 144,108"/>
      <!-- Tier 1 -->
      <polygon points="142,109 178,109 181,116 139,116"/>
      <line x1="140" y1="113" x2="180" y2="113" stroke="#84520A" stroke-width="0.8"/>
      <!-- Tier 2 -->
      <polygon points="137,117 183,117 186,126 134,126"/>
      <line x1="135" y1="122" x2="185" y2="122" stroke="#84520A" stroke-width="0.8"/>
      <!-- Tier 3 -->
      <polygon points="132,127 188,127 191,138 129,138"/>
      <line x1="130" y1="133" x2="190" y2="133" stroke="#84520A" stroke-width="0.8"/>
      <!-- Tier 4 -->
      <polygon points="127,139 193,139 196,152 124,152"/>
      <line x1="125" y1="146" x2="195" y2="146" stroke="#84520A" stroke-width="0.8"/>
      <!-- Tier 5 (Base Gopuram) -->
      <polygon points="122,153 198,153 201,168 119,168"/>
      <!-- Gopuram Gateway (Thiruvaasal) -->
      <path d="M 152 168 L 152 157 C 152 153 168 153 168 157 L 168 168 Z" fill="#0A1122"/>
      <!-- Gopuram Base Plinth -->
      <rect x="114" y="168" width="92" height="7" rx="1.5"/>
      <rect x="110" y="176" width="100" height="5" rx="1"/>
    </g>

    <!-- Star & Flashes on Gopuram Sides -->
    <g fill="url(#silverGrad)">
      <!-- 8-pointed stars flanking temple -->
      <polygon points="104,142 107,147 112,147 108,150 110,155 105,152 101,155 103,150 99,147 104,147" transform="scale(0.8) translate(25, 20)"/>
      <polygon points="216,142 219,147 224,147 220,150 222,155 217,152 213,155 215,150 211,147 216,147" transform="scale(0.8) translate(55, 20)"/>
    </g>

    <!-- 4. Ashoka Lion Capital (Emblem of India Crest at Top) -->
    <g id="lionCapital" fill="url(#goldGrad)">
      <!-- Lion heads simplified stylized representation -->
      <ellipse cx="160" cy="30" rx="18" ry="12"/>
      <!-- Center Lion Face -->
      <circle cx="160" cy="27" r="7" fill="#FFF3A8"/>
      <circle cx="157" cy="26" r="1" fill="#000"/>
      <circle cx="163" cy="26" r="1" fill="#000"/>
      <!-- Left Lion Face -->
      <ellipse cx="147" cy="31" rx="6" ry="7" transform="rotate(-15 147 31)"/>
      <!-- Right Lion Face -->
      <ellipse cx="173" cy="31" rx="6" ry="7" transform="rotate(15 173 31)"/>
      <!-- Lion Capital Pedestal with Ashoka Chakra -->
      <rect x="138" y="38" width="44" height="8" rx="2"/>
      <circle cx="160" cy="42" r="3.5" fill="#000080" stroke="#FFF3A8" stroke-width="0.8"/>
      <rect x="142" y="46" width="36" height="4" rx="1"/>
    </g>

    <!-- 5. Tamil Motto Scroll inside Shield: "வாய்மையே வெல்லும்" -->
    <path d="M 108 190 C 135 186 185 186 212 190 L 210 203 C 185 199 135 199 110 203 Z" fill="url(#goldGrad)"/>
    <text x="160" y="199" font-family="'Mukta Malar', 'Noto Sans Tamil', 'Latha', 'Segoe UI', sans-serif" 
          font-size="8.5" font-weight="900" fill="#050C1A" text-anchor="middle" letter-spacing="0.5">வாய்மையே வெல்லும்</text>

    <!-- English Motto / Duty Dignity Discipline -->
    <text x="160" y="218" font-family="'Inter', -apple-system, sans-serif" 
          font-size="6.2" font-weight="800" fill="#E5E7EB" text-anchor="middle" letter-spacing="1">DUTY • DIGNITY • DISCIPLINE</text>

    <!-- 6. Bottom Banner / Ribbon: "TAMIL NADU POLICE" -->
    <g id="bottomRibbon">
      <!-- Ribbon Left Wing -->
      <path d="M 40 300 L 78 280 L 78 305 L 45 320 Z" fill="#84520A"/>
      <polygon points="40,300 45,320 28,310" fill="#603805"/>
      <!-- Ribbon Right Wing -->
      <path d="M 280 300 L 242 280 L 242 305 L 275 320 Z" fill="#84520A"/>
      <polygon points="280,300 275,320 292,310" fill="#603805"/>

      <!-- Ribbon Center Main Arc -->
      <path d="M 68 285 C 110 273 210 273 252 285 L 244 322 C 205 308 115 308 76 322 Z" 
            fill="url(#goldGrad)" stroke="#603805" stroke-width="1.5"/>

      <!-- Ribbon Text Inner Groove -->
      <path d="M 74 290 C 114 278 206 278 246 290" fill="none" stroke="#84520A" stroke-width="0.8"/>
      <path d="M 80 316 C 118 303 202 303 240 316" fill="none" stroke="#84520A" stroke-width="0.8"/>

      <!-- Ribbon Main Title: "TAMIL NADU POLICE" -->
      <text x="160" y="306" font-family="'Cinzel', 'Times New Roman', 'Inter', serif" 
            font-size="13.5" font-weight="900" fill="#0A1122" text-anchor="middle" letter-spacing="1.8">TAMIL NADU POLICE</text>
      
      <!-- Subtitle: TIRUCHIRAPPALLI CITY -->
      <text x="160" y="338" font-family="'Inter', sans-serif" 
            font-size="8.5" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.2">TIRUCHIRAPPALLI CITY POLICE</text>
    </g>

  </g>
</svg>
